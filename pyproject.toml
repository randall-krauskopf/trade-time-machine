[project]
name = "trade-time-machine"
version = "0.2.0"
description = "Static snapshot generator for the Lana Straw Trade Time Machine."
requires-python = ">=3.12"

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["node_modules", "docs"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Test fixtures read best as one row per record.
"tests/**" = ["E501"]

[tool.ruff.lint.isort]
force-sort-within-sections = true

[tool.coverage.run]
source = ["trade_time_machine"]
omit = ["trade_time_machine/__main__.py"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 95
